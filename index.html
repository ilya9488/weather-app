<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Weather app powered by OpenWeatherMap" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Weather</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme
      try {
        var saved = localStorage.getItem('weather:theme')
        var theme = saved
          ? JSON.parse(saved)
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        document.documentElement.dataset.theme = theme
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script type="module" crossorigin src="./assets/index-CYI_4lP3.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Pmxg2APa.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
