name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test

      - name: Provide the API key from secrets (if set)
        env:
          OWM_KEY: ${{ secrets.VITE_OWM_API_KEY }}
        run: |
          if [ -n "$OWM_KEY" ]; then
            echo "VITE_OWM_API_KEY=$OWM_KEY" > .env.production.local
          fi

      - run: npm run build

      # GitHub Pages serves the gh-pages branch
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
